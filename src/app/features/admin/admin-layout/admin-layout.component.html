<div class="admin-wrapper" [dir]="i18n.lang === 'ar' ? 'rtl' : 'ltr'">

  <!-- Sidebar -->
  <aside class="sidebar glass-dark shadow-lg">
    <div class="sidebar-brand">
      <div class="admin-logo">
        <span class="admin-logo-icon">
          <svg class="logo-svg-sm" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="12" fill="url(#logoGradAdmin)"/>
            <defs>
              <linearGradient id="logoGradAdmin" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#4f46e5"/>
                <stop offset="100%" stop-color="#818cf8"/>
              </linearGradient>
            </defs>
            <path d="M24 9C17.5 9 14 14.5 14 18V20H34V18C34 14.5 30.5 9 24 9Z" fill="#10b981"/>
            <path d="M24 9C19.5 9 17 12 16 15C18 13 20.5 11.5 24 11.5C27.5 11.5 30 13 32 15C31 12 28.5 9 24 9Z" fill="#34d399" opacity="0.5"/>
            <path d="M27 6.5C27 5.5 26.5 5 25.5 5C26.7 5 27.6 5.8 27.6 7C27.6 8.4 26 9.8 24 9.8C26 9.8 27 8.5 27 6.5Z" fill="#fbbf24"/>
            <rect x="12" y="20" width="24" height="15" rx="3" fill="#fff" opacity="0.95"/>
            <rect x="15" y="20" width="18" height="5" rx="2.5" fill="#e0e7ff"/>
            <path d="M19 20V17C19 15.5 20.5 14.5 22 14.5H26C27.5 14.5 29 15.5 29 17V20" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="admin-logo-text">
          <h5 class="text-white mb-0">AL MADINA</h5>
          <small class="text-white-50">Admin Panel</small>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menu" [routerLink]="item.route"
         routerLinkActive="active" class="nav-link">
        <span class="nav-icon">{{ item.icon }}</span>
        <span>{{ i18n.t(item.label) }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <app-language-switcher></app-language-switcher>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <div class="admin-header glass">
      <h4 class="mb-0 fw-bold">
        <i class="bi bi-speedometer2 me-2" style="color:var(--primary, #6c5ce7);"></i>
        {{ i18n.t('admin') }}
      </h4>
    </div>
    <div class="admin-content">
      <ng-content></ng-content>
    </div>
  </main>
</div>
